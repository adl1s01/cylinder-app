services:
  - type: web
    name: cylinder-app
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cylinder-db
          property: connectionString

databases:
  - name: cylinder-db
    plan: free
