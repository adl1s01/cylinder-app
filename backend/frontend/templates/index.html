<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учёт баллонов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <link rel="icon" href="/static/img/icon-192.png">
    <style>
        :root { --sidebar-width: 260px; }
        body { display: flex; min-height: 100vh; }
        .sidebar { width: var(--sidebar-width); background: #1a1d23; color: #adb5bd; flex-shrink: 0; position: fixed; top: 0; bottom: 0; overflow-y: auto; z-index: 1000; }
        .sidebar .nav-link { color: #adb5bd; border-radius: 0; padding: 10px 20px; font-size: 15px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: rgba(255,255,255,.08); }
        .sidebar .nav-link i { width: 24px; text-align: center; margin-right: 8px; }
        .sidebar-brand { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 18px; font-weight: 600; color: #fff; }
        .main-content { margin-left: var(--sidebar-width); flex: 1; padding: 24px; background: #f5f6fa; min-height: 100vh; }
        .card-stat { border-left: 4px solid #0d6efd; }
        .card-stat.danger { border-left-color: #dc3545; }
        .card-stat.warning { border-left-color: #ffc107; }
        .card-stat.success { border-left-color: #198754; }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .table-clickable tr { cursor: pointer; }
        .photo-preview { max-width: 200px; max-height: 200px; border-radius: 8px; margin-top: 8px; }
        .login-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #1a1d23, #2c3e50); }
        .login-card { width: 400px; padding: 40px; background: #fff; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <nav class="sidebar d-none" id="sidebar">
        <div class="sidebar-brand"><i class="bi bi-droplet-fill text-primary"></i> Учёт баллонов</div>
        <ul class="nav flex-column mt-3">
            <li><a href="#" class="nav-link active" data-page="dashboard"><i class="bi bi-speedometer2"></i> Панель</a></li>
            <li><a href="#" class="nav-link" data-page="fleets"><i class="bi bi-buildings"></i> Автопарки</a></li>
            <li><a href="#" class="nav-link" data-page="buses"><i class="bi bi-bus-front"></i> Автобусы</a></li>
            <li><a href="#" class="nav-link" data-page="cylinders"><i class="bi bi-droplet"></i> Баллоны</a></li>
            <li><a href="#" class="nav-link" data-page="inspections"><i class="bi bi-clipboard-check"></i> Испытания</a></li>
            <li><a href="#" class="nav-link" data-page="repairs"><i class="bi bi-tools"></i> Ремонт</a></li>
            <li><a href="#" class="nav-link" data-page="stock"><i class="bi bi-box-seam"></i> Склад</a></li>
            <li><a href="#" class="nav-link" data-page="reports"><i class="bi bi-graph-up"></i> Отчёты</a></li>
            <li><a href="#" class="nav-link" data-page="settings"><i class="bi bi-gear"></i> Настройки</a></li>
            <li id="nav-users" class="d-none"><a href="#" class="nav-link" data-page="users"><i class="bi bi-people"></i> Пользователи</a></li>
        </ul>
        <div class="mt-auto p-3 border-top border-secondary" style="position:absolute;bottom:0;width:100%">
            <div class="text-light small" id="sidebar-user"></div>
            <button class="btn btn-sm btn-outline-secondary mt-2 w-100" onclick="logout()">Выйти</button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content" id="main-content">
        <div id="page-content"></div>
    </div>

    <!-- Toast -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Login -->
    <div id="login-page" class="login-page">
        <div class="login-card">
            <h3 class="text-center mb-4">Учёт баллонов</h3>
            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label">Логин</label>
                    <input type="text" class="form-control" id="login-user" required autocomplete="username">
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" class="form-control" id="login-pass" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Войти</button>
            </form>
            <p class="text-muted text-center mt-3 small">admin / admin123</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
